<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#000;--mute:#8A8A8E;--sep:rgba(60,60,67,.18);--blue:#007AFF;--green:#34C759;--orange:#FF9500;--fill:rgba(118,118,128,.12);--bar:rgba(242,242,247,.78);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1C1C1E;--ink:#fff;--mute:#98989F;--sep:rgba(84,84,88,.6);--blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--fill:rgba(118,118,128,.24);--bar:rgba(0,0,0,.72)}}
:root[data-theme="dark"]{--bg:#000;--card:#1C1C1E;--ink:#fff;--mute:#98989F;--sep:rgba(84,84,88,.6);--blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--fill:rgba(118,118,128,.24);--bar:rgba(0,0,0,.72)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.nav .b{color:var(--blue);font-size:17px;min-width:44px;height:36px;display:flex;align-items:center}
.nav .b.r{justify-content:flex-end;font-size:30px;font-weight:300}
.nav .m{display:flex;gap:18px;font-size:24px;color:var(--blue)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
h1{font-size:34px;font-weight:700;letter-spacing:.37px;margin:8px 0 16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}.hd img{width:44px;height:44px;border-radius:10px;margin-bottom:8px}
.cap{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:-.08px;margin:24px 16px 6px}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.sum{display:grid;grid-template-columns:1fr 1fr}
.sum div{padding:14px 16px;border-bottom:.5px solid var(--sep)}
.sum div:nth-child(odd){border-right:.5px solid var(--sep)}
.sum div:nth-last-child(-n+2){border-bottom:0}
.sum small{display:block;color:var(--mute);font-size:13px}
.sum b{font-size:22px;font-weight:600;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-top:.5px solid var(--sep)}
.tot b{font-size:22px;font-weight:700;color:var(--green)}
.day{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 16px;position:relative}
.day+.day::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.day:active{background:var(--fill)}
.day .l small,.day .r small{display:block;color:var(--mute);font-size:14px}
.day .r{text-align:right;font-variant-numeric:tabular-nums}
.day .r b{font-weight:600;color:var(--green)}
.day .r small.x{color:var(--orange)}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center;height:56px;position:sticky;top:0;background:var(--bg)}
.ph b{font-weight:600}.ph button{color:var(--blue)}.ph .sv{font-weight:600}
.fld{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:44px;position:relative}
.fld+.fld::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.fld input{font:inherit;font-size:17px;border:0;background:transparent;color:var(--ink);text-align:right;width:55%;outline:0;padding:10px 0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:10px 16px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.del{display:block;width:100%;color:#FF3B30;padding:12px;text-align:center;background:var(--card);border-radius:12px;margin-top:20px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;color:var(--mute);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
.tabs button span{font-size:22px;line-height:1}.tabs button.on{color:var(--blue)}
body.st .nav .m,body.st .nav .r{visibility:hidden}
.wrap{padding-bottom:96px}
.dl{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}.dl.up{color:var(--green)}.dl.dn{color:#FF3B30}
.mh{padding:14px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}.mh small{flex-basis:100%;color:var(--mute);font-size:13px}.mh b{font-size:28px;font-weight:700;letter-spacing:.3px}
.mr{display:flex;justify-content:space-between;gap:8px;padding:11px 16px;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}.mr span:first-child{color:var(--mute)}.mr span:last-child{text-align:right}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding:14px 12px 10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .col span{width:100%;max-width:28px;background:var(--blue);border-radius:5px 5px 2px 2px}
.chart .col i{font-style:normal;font-size:10px;color:var(--mute)}.chart .col small{font-size:11px;color:var(--mute)}


.grp{border-radius:10px}
.sum b{font-size:21px}
.tot b{color:var(--ink)}
.day .r b{color:var(--ink);font-weight:500}
.mh b{font-size:26px}
.hd img{width:40px;height:40px;border-radius:9px}
.chart .col span{border-radius:3px 3px 1px 1px}
.seg{border-radius:8px}.seg button{border-radius:6px}
.panel{border-radius:12px 12px 0 0}
.del{border-radius:10px}
.btn,.tabs{box-shadow:none}
.b1{flex:1;background:var(--blue);color:#fff;border-radius:10px;padding:12px 8px;font-size:15px;font-weight:500}
</style>
</head>

<script>
var KEY="uchet-v1",D={},M=new Date(),ET="Реклама",OLD=null;

var MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var WD=["вс","пн","вт","ср","чт","пт","сб"];
function load(){try{var r=localStorage.getItem(KEY);if(r)D=JSON.parse(r)}catch(e){}}

function p2(n){return n<10?"0"+n:""+n}
function ds(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function money(n){return Math.round(n).toLocaleString("ru-RU")+"\u00A0₽"}

function render(){
  if(V==="s")return stats();

function form(k){
  OLD=k||null;var e=k?D[k]:{};ET=e.etype||"Реклама";
  var date=k||(function(){var t=new Date();return (t.getFullYear()===M.getFullYear()&&t.getMonth()===M.getMonth())?ds(t):ds(M)})();
  function f(id,l,v,t){return '<div class="fld"><label for="'+id+'">'+l+'</label><input id="'+id+'" '+(t||'inputmode="decimal" placeholder="0"')+' value="'+(v==null?"":String(v).replace(/"/g,""))+'"></div>'}
  document.getElementById("panel").innerHTML='<div class="ph"><button data-close>Отмена</button><b>'+(k?"День":"Новый день")+'</b><button class="sv" data-save>Готово</button></div><div class="grp">'+f("fd","Дата",date,'type="date"')+f("fo","Заказы",e.orders)+f("fr","Выручка, ₽",e.revenue)+f("fp","Чистая прибыль, ₽",e.profit)+'</div><div class="cap">Доп. доход</div><div class="grp">'+f("fx","Сумма, ₽",e.extra)+'<div class="seg"><button data-et="Реклама"'+(ET==="Реклама"?' class="on"':'')+'>Реклама</button><button data-et="Грузоперевозки"'+(ET==="Грузоперевозки"?' class="on"':'')+'>Грузоперевозки</button><button data-et="Другое"'+(ET==="Другое"?' class="on"':'')+'>Другое</button></div></div>'+(k?'<button class="del" data-del>Удалить день</button>':'');
  document.getElementById("sheet").classList.add("on")}
function closeS(){document.getElementById("sheet").classList.remove("on")}

function io(){document.getElementById("panel").innerHTML='<div class="ph"><button data-close>Закрыть</button><b>Данные</b><span></span></div><div class="grp"><div style="padding:12px 16px"><textarea id="io" style="width:100%;height:150px;font:13px/1.3 ui-monospace,Menlo,monospace;border:0;background:transparent;color:var(--ink);outline:0;resize:none" placeholder="Сюда вставь данные"></textarea></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="b1" data-iocopy>Скопировать мои данные</button><button class="b1" data-ioload>Загрузить из текста</button></div><div id="iom" style="color:var(--mute);font-size:14px;margin:10px 4px;min-height:20px"></div>';document.getElementById("sheet").classList.add("on")}
function iomsg(t){document.getElementById("iom").textContent=t}
function iocopy(){var ta=document.getElementById("io"),t=JSON.stringify(D);ta.value=t;ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}
 if(ok)return iomsg("Скопировано: "+Object.keys(D).length+" дн. Теперь вставь в другом приложении.");
 try{navigator.clipboard.writeText(t).then(function(){iomsg("Скопировано: "+Object.keys(D).length+" дн.")},function(){iomsg("Не скопировалось само. Нажми и удерживай текст выше, выбери «Выбрать всё» и «Скопировать».")})}catch(e){iomsg("Нажми и удерживай текст выше, выбери «Выбрать всё» и «Скопировать».")}}
function ioload(){var ta=document.getElementById("io"),o;try{o=JSON.parse(ta.value)}catch(e){return iomsg("Не получилось прочитать текст. Вставь данные целиком.")}
 if(!o||typeof o!=="object")return iomsg("Не получилось прочитать текст.");var n=0;Object.keys(o).forEach(function(k){if(/^\d{4}-\d\d-\d\d$/.test(k)&&o[k]&&typeof o[k]==="object"){D[k]=o[k];n++}});
 save();render();iomsg(n?"Загружено дней: "+n:"В тексте нет записей.")}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(e.target.id==="sheet")return closeS();
  if(!b)return;var d=b.dataset;
  if(d.v){V=d.v;document.body.classList.toggle("st",V==="s");[].forEach.call(document.querySelectorAll(".tabs button"),function(x){x.classList.toggle("on",x.dataset.v===V)});render()}
  else if(d.p){M.setMonth(M.getMonth()+ +d.p);render()}
  else if(d.add!==undefined)form(null);
  else if(d.edit)form(d.edit);
  else if(d.io!==undefined)io();
  else if(d.iocopy!==undefined)iocopy();
  else if(d.ioload!==undefined)ioload();
  else if(d.close!==undefined)closeS();
  else if(d.et){ET=d.et;[].forEach.call(document.querySelectorAll(".seg button"),function(x){x.classList.toggle("on",x.dataset.et===ET)})}
  else if(d.del!==undefined){delete D[OLD];save();closeS();render()}
  else if(d.save!==undefined){
    var dt=document.getElementById("fd").value;if(!dt)return;
    var v=function(i){return document.getElementById(i).value};
    if(OLD&&OLD!==dt)delete D[OLD];
    D[dt]={orders:v("fo"),revenue:v("fr"),profit:v("fp"),extra:v("fx"),etype:ET};
    save();closeS();var n=new Date(dt+"T12:00:00");M=new Date(n.getFullYear(),n.getMonth(),1);render()}});

var V="d";
function pc(c,p){return p?(c-p)/p*100:null}
function chip(v,u){if(v==null)return"";var up=v>=0;return '<span class="dl '+(up?"up":"dn")+'">'+(up?"▲ +":"▼ −")+Math.abs(v).toFixed(1).replace(".",",")+u+'</span>'}
function stats(){
  var by={};
  Object.keys(D).sort().forEach(function(k){var m=k.slice(0,7),e=D[k],a=by[m]||(by[m]={o:0,r:0,p:0,x:0,n:0,hi:-1e15,lo:1e15}),p=num(e.profit);a.o+=num(e.orders);a.r+=num(e.revenue);a.p+=p;a.x+=num(e.extra);a.n++;if(p>a.hi)a.hi=p;if(p<a.lo)a.lo=p});
  var ms=Object.keys(by).sort(),h='<h1>Статистика</h1>';
  if(!ms.length){document.getElementById("app").innerHTML=h+'<div class="grp"><div class="empty">Пока нет данных.</div></div>';return}
  var T={o:0,r:0,p:0,x:0,n:0};ms.forEach(function(m){var a=by[m];T.o+=a.o;T.r+=a.r;T.p+=a.p;T.x+=a.x;T.n+=a.n});
  function mg(a){return a.r?a.p/a.r*100:0}
  function pr(n){return n.toFixed(1).replace(".",",")+"%"}
  h+='<div class="grp"><div class="sum"><div><small>Выручка</small><b>'+money(T.r)+'</b></div><div><small>Чистая прибыль</small><b>'+money(T.p)+'</b></div><div><small>Заказы</small><b>'+T.o.toLocaleString("ru-RU")+'</b></div><div><small>Рентабельность</small><b>'+pr(mg(T))+'</b></div></div><div class="tot"><span>Всего заработано</span><b>'+money(T.p+T.x)+'</b></div></div>';
  var mx=Math.max.apply(null,ms.map(function(m){return by[m].p}));
  h+='<div class="cap">Чистая прибыль по месяцам</div><div class="grp"><div class="chart">';
  ms.forEach(function(m){var a=by[m];h+='<div class="col"><i>'+Math.round(a.p/1000)+'к</i><span style="height:'+Math.max(4,a.p/mx*100)+'%"></span><small>'+MN[+m.slice(5)-1].slice(0,3)+'</small></div>'});
  h+='</div></div>';
  for(var i=ms.length-1;i>=0;i--){
    var m=ms[i],a=by[m],q=i?by[ms[i-1]]:null;
    function row(l,v,d){return '<div class="mr"><span>'+l+'</span><span>'+v+(d?' '+d:'')+'</span></div>'}
    h+='<div class="cap">'+MN[+m.slice(5)-1]+' '+m.slice(0,4)+'</div><div class="grp"><div class="mh"><small>Чистая прибыль</small><b>'+money(a.p)+'</b>'+(q?chip(pc(a.p,q.p),"%"):"")+'</div>'
     +row("Заказы",a.o.toLocaleString("ru-RU"),q&&chip(pc(a.o,q.o),"%"))
     +row("Выручка",money(a.r),q&&chip(pc(a.r,q.r),"%"))
     +row("Рентабельность",pr(mg(a)),q&&chip(mg(a)-mg(q)," п.п."))
     +row("Средний чек",money(a.o?a.r/a.o:0),q&&chip(pc(a.r/a.o,q.r/q.o),"%"))
     +row("Прибыль с заказа",money(a.o?a.p/a.o:0),q&&chip(pc(a.p/a.o,q.p/q.o),"%"))
     +row("Заказов в день",(a.o/a.n).toFixed(1).replace(".",","),q&&chip(pc(a.o/a.n,q.o/q.n),"%"))
     +row("Доп. доходы",money(a.x),q&&q.x?chip(pc(a.x,q.x),"%"):"")
     +row("Лучший день",money(a.hi))+row("Худший день",money(a.lo))+'</div>'}
  document.getElementById("app").innerHTML=h}
